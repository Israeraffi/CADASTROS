<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADM_Cad_user</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="formCad">
      <h1>CADRASTO DE USUÁRIO</h1>
      <label for="name" id="lname">Digite o nome:</label>
      <input type="text" name="" id="nome" placeholder="nome..." />

      <label for="email" id="lemai">Digite o E-mail:</label>
      <input type="email" id="email" placeholder="E-mail..." />

      <label for="idade" id="lidade">Digite a idade:</label>
      <input type="date" id="dataNascimento" placeholder="idade..." />

      <label for="cargo" id="lcargo">Digite o cargo:</label>
      <input type="text" id="cargo" placeholder="cargo..." />

      <button type="submit">cadrastar</button>
    </form>
    <a href="users.html" id="link">Consultar usuários</a>
    <script src="script.js"></script>
  </body>
</html>
